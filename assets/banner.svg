<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Priyanshu Sekhar Nanda</title>
  <desc id="d">Founder and full-stack developer building AI, IoT and web products from Bengaluru.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f4ede1" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4d1a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeGrid" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".2"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="400" fill="url(#fadeGrid)"/></mask>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="62" y1="0" x2="700" y2="0">
      <stop offset="0" stop-color="#f4ede1"/>
      <stop offset=".55" stop-color="#f4ede1"/>
      <stop offset="1" stop-color="#ffb08f"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .drift1 { animation: d1 14s ease-in-out infinite; transform-origin: center; }
      .drift2 { animation: d2 18s ease-in-out infinite; transform-origin: center; }
      @keyframes d1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,25px) scale(1.12); } }
      @keyframes d2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-70px,-20px) scale(1.1); } }
      .rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .r1 { animation-delay: .1s; } .r2 { animation-delay: .35s; } .r3 { animation-delay: .6s; } .r4 { animation-delay: .85s; }
      @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
      .word { opacity: 0; animation: word 12s infinite both; }
      /* w1 starts mid-cycle so the first frame (and any viewer without animation) shows a word */
      .w1 { opacity: 1; animation-delay: -1s; } .w2 { animation-delay: 2s; } .w3 { animation-delay: 5s; } .w4 { animation-delay: 8s; }
      @keyframes word { 0% { opacity: 0; transform: translateY(10px); } 4%,22% { opacity: 1; transform: none; } 26%,100% { opacity: 0; transform: translateY(-10px); } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 7s linear infinite; }
      @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1480px); } }
      .pulse { animation: pulse 2s ease-out infinite; transform-origin: 1036px 66px; }
      @keyframes pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3); } }
      .orbit { animation: spin 26s linear infinite; transform-origin: 1080px 230px; }
      .orbit2 { animation: spin 40s linear infinite reverse; transform-origin: 1080px 230px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="#0a0a0a"/>
    <rect width="1280" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
    <ellipse class="drift1" cx="980" cy="120" rx="380" ry="260" fill="url(#g1)"/>
    <ellipse class="drift2" cx="1180" cy="360" rx="320" ry="220" fill="url(#g2)"/>
    <rect class="scan" x="0" y="0" width="140" height="400" fill="#f4ede1" opacity=".025"/>

    <!-- orbit motif: two systems connected, like conversations becoming work -->
    <g opacity=".9">
      <circle cx="1080" cy="230" r="118" fill="none" stroke="#f4ede1" stroke-opacity=".12"/>
      <circle cx="1080" cy="230" r="72" fill="none" stroke="#f4ede1" stroke-opacity=".08" stroke-dasharray="3 7"/>
      <g class="orbit">
        <circle cx="1198" cy="230" r="6" fill="#ff4d1a"/>
        <circle cx="962" cy="230" r="3.5" fill="#f4ede1" opacity=".7"/>
      </g>
      <g class="orbit2">
        <circle cx="1080" cy="158" r="4" fill="#ffb347"/>
      </g>
      <rect x="1050" y="200" width="60" height="60" rx="16" fill="#f4ede1"/>
      <circle cx="1070" cy="220" r="6.5" fill="#0a0a0a"/>
      <circle cx="1090" cy="240" r="6.5" fill="#ff4d1a"/>
      <path d="M1070 220 1090 240" stroke="#0a0a0a" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- status chip -->
    <g class="rise r1">
      <rect x="64" y="52" width="318" height="34" rx="17" fill="#f4ede1" fill-opacity=".06" stroke="#f4ede1" stroke-opacity=".14"/>
      <circle cx="86" cy="69" r="5" fill="#3fd47a"/>
      <circle cx="86" cy="69" r="5" fill="#3fd47a" opacity=".6"><animate attributeName="r" values="5;11;5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="2s" repeatCount="indefinite"/></circle>
      <text x="102" y="74" class="mono" font-size="13.5" fill="#f4ede1" fill-opacity=".85">Building NEXUS @ R2E Technologies</text>
    </g>

    <g class="rise r2">
      <text x="62" y="176" class="sans" font-size="66" font-weight="800" letter-spacing="-2.5" fill="url(#name)">Priyanshu Sekhar</text>
      <text x="62" y="246" class="sans" font-size="66" font-weight="800" letter-spacing="-2.5" fill="url(#name)">Nanda<tspan fill="#ff4d1a">.</tspan></text>
    </g>

    <g class="rise r3">
      <text x="64" y="300" class="sans" font-size="22" fill="#f4ede1" fill-opacity=".62">Founder · Full-stack developer · I build</text>
      <g class="sans" font-size="22" font-weight="700" fill="#ff7a4d">
        <text class="word w1" x="454" y="300">AI products.</text>
        <text class="word w2" x="454" y="300">IoT systems.</text>
        <text class="word w3" x="454" y="300">realtime web apps.</text>
        <text class="word w4" x="454" y="300">things that ship.</text>
      </g>
    </g>

    <g class="rise r4 mono" font-size="13" fill="#f4ede1" fill-opacity=".45">
      <text x="64" y="350">~/bengaluru <tspan fill="#ff4d1a" fill-opacity=".9">❯</tspan> react · node · next.js · java · python · iot<tspan class="caret" fill="#f4ede1" fill-opacity=".8"> ▍</tspan></text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="21.5" fill="none" stroke="#f4ede1" stroke-opacity=".1"/>
</svg>
